<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">AltRisk Calculator risk matrix and scenario comparison</title>
  <desc id="d">A likelihood and impact risk matrix with three numbered scenarios, beside a bar chart of base, stress, and severe outcomes against a limit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9fb"/>
      <stop offset="1" stop-color="#e5f0f7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>

  <!-- Risk matrix -->
  <g transform="translate(60 85)">
    <rect width="420" height="430" rx="22" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
    <text x="30" y="58" font-size="36" font-weight="700" fill="#10233f">Risk matrix</text>
    <rect x="49" y="84" width="76" height="76" rx="10" fill="#dff5f1"/>
    <rect x="131" y="84" width="76" height="76" rx="10" fill="#dff5f1"/>
    <rect x="213" y="84" width="76" height="76" rx="10" fill="#dff5f1"/>
    <rect x="295" y="84" width="76" height="76" rx="10" fill="#fbeccc"/>
    <rect x="49" y="166" width="76" height="76" rx="10" fill="#dff5f1"/>
    <rect x="131" y="166" width="76" height="76" rx="10" fill="#dff5f1"/>
    <rect x="213" y="166" width="76" height="76" rx="10" fill="#fbeccc"/>
    <rect x="295" y="166" width="76" height="76" rx="10" fill="#fbeccc"/>
    <rect x="49" y="248" width="76" height="76" rx="10" fill="#dff5f1"/>
    <rect x="131" y="248" width="76" height="76" rx="10" fill="#fbeccc"/>
    <rect x="213" y="248" width="76" height="76" rx="10" fill="#fbeccc"/>
    <rect x="295" y="248" width="76" height="76" rx="10" fill="#ece8fa"/>
    <rect x="49" y="330" width="76" height="76" rx="10" fill="#fbeccc"/>
    <rect x="131" y="330" width="76" height="76" rx="10" fill="#fbeccc"/>
    <rect x="213" y="330" width="76" height="76" rx="10" fill="#ece8fa"/>
    <rect x="295" y="330" width="76" height="76" rx="10" fill="#e0e9fb"/>
    <g font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff">
      <circle cx="87" cy="122" r="22" fill="#147d92"/>
      <text x="87" y="131">1</text>
      <circle cx="169" cy="286" r="22" fill="#b7791f"/>
      <text x="169" y="295">2</text>
      <circle cx="333" cy="368" r="22" fill="#6253b8"/>
      <text x="333" y="377">3</text>
    </g>
  </g>

  <!-- Scenario comparison -->
  <g transform="translate(510 85)">
    <rect width="390" height="430" rx="22" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
    <text x="30" y="58" font-size="32" font-weight="700" fill="#10233f">Scenarios vs limit</text>
    <line x1="30" y1="370" x2="360" y2="370" stroke="#d4e3e8" stroke-width="2"/>
    <rect x="50" y="250" width="70" height="120" rx="8" fill="#20a79c"/>
    <rect x="165" y="180" width="70" height="190" rx="8" fill="#f2b441"/>
    <rect x="280" y="120" width="70" height="250" rx="8" fill="#7c6ccf"/>
    <line x1="30" y1="240" x2="360" y2="240" stroke="#e0785c" stroke-width="4" stroke-dasharray="12 8"/>
    <g font-size="30" text-anchor="middle" fill="#10233f">
      <text x="85" y="412">Base</text>
      <text x="200" y="412">Stress</text>
      <text x="315" y="412">Severe</text>
    </g>
  </g>
</svg>
