<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Green investing lab with solar, wind, and diversified basket</title>
  <desc id="d">Solar panels and wind turbines on green hills beside a green basket card with illustrative allocation bars.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f5f0"/>
      <stop offset="1" stop-color="#f4f9fb"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#sky)"/>

  <circle cx="760" cy="150" r="60" fill="#f2b441" opacity="0.35"/>
  <circle cx="760" cy="150" r="36" fill="#f2b441"/>

  <path d="M0 400 Q180 330 360 390 T720 380 T960 360 L960 600 L0 600 Z" fill="#b9e3cb"/>
  <path d="M0 460 Q240 400 480 450 T960 430 L960 600 L0 600 Z" fill="#3fa66b"/>

  <!-- Solar array -->
  <g transform="translate(130 300)">
    <line x1="0" y1="110" x2="0" y2="160" stroke="#10233f" stroke-width="6"/>
    <g transform="skewX(-12)">
      <rect x="-70" y="0" width="240" height="110" rx="6" fill="#10233f"/>
      <g stroke="#3b82c4" stroke-width="2" opacity="0.9">
        <line x1="-70" y1="37" x2="170" y2="37"/>
        <line x1="-70" y1="73" x2="170" y2="73"/>
        <line x1="-10" y1="0" x2="-10" y2="110"/>
        <line x1="50" y1="0" x2="50" y2="110"/>
        <line x1="110" y1="0" x2="110" y2="110"/>
      </g>
      <rect x="-70" y="0" width="240" height="110" rx="6" fill="none" stroke="#147d92" stroke-width="4"/>
    </g>
  </g>

  <!-- Wind turbines -->
  <g transform="translate(360 300)">
    <rect x="-5" y="0" width="10" height="160" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
    <circle r="8" fill="#10233f"/>
    <path d="M0 0 L-6 -70 Q0 -80 6 -70 Z" fill="#7c6ccf"/>
    <path d="M0 0 L-6 -70 Q0 -80 6 -70 Z" fill="#7c6ccf" transform="rotate(120)"/>
    <path d="M0 0 L-6 -70 Q0 -80 6 -70 Z" fill="#7c6ccf" transform="rotate(240)"/>
  </g>
  <g transform="translate(480 340) scale(0.8)">
    <rect x="-5" y="0" width="10" height="160" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
    <circle r="8" fill="#10233f"/>
    <path d="M0 0 L-6 -70 Q0 -80 6 -70 Z" fill="#6253b8"/>
    <path d="M0 0 L-6 -70 Q0 -80 6 -70 Z" fill="#6253b8" transform="rotate(120)"/>
    <path d="M0 0 L-6 -70 Q0 -80 6 -70 Z" fill="#6253b8" transform="rotate(240)"/>
  </g>

  <!-- Green basket card -->
  <g transform="translate(580 40)">
    <rect width="340" height="330" rx="22" fill="#ffffff" stroke="#d4e3e8" stroke-width="2" opacity="0.97"/>
    <text x="28" y="70" font-size="40" font-weight="700" fill="#10233f">Green basket</text>
    <g font-size="30" fill="#10233f">
      <text x="28" y="152">Solar</text>
      <rect x="180" y="136" width="132" height="16" rx="8" fill="#e1ecf1"/>
      <rect x="180" y="136" width="80" height="16" rx="8" fill="#f2b441"/>
      <text x="28" y="222">Wind</text>
      <rect x="180" y="206" width="132" height="16" rx="8" fill="#e1ecf1"/>
      <rect x="180" y="206" width="60" height="16" rx="8" fill="#3b82c4"/>
      <text x="28" y="292">Storage</text>
      <rect x="180" y="276" width="132" height="16" rx="8" fill="#e1ecf1"/>
      <rect x="180" y="276" width="40" height="16" rx="8" fill="#20a79c"/>
    </g>
    <text x="28" y="344" font-size="28" fill="#607587">Illustrative mix only</text>
  </g>

  <!-- Caption -->
  <g transform="translate(40 520)">
    <rect width="470" height="56" rx="28" fill="#10233f"/>
    <text x="235" y="37" text-anchor="middle" font-size="28" fill="#ffffff">Green assets carry risk</text>
  </g>
</svg>
