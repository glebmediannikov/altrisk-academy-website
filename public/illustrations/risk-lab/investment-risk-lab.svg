<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Investment risk lab portfolio dashboard</title>
  <desc id="d">A hypothetical portfolio sandbox with an allocation donut, simulated growth paths, and risk indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9fb"/>
      <stop offset="1" stop-color="#e5f0f7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>

  <text x="50" y="112" font-size="54" font-weight="700" fill="#10233f">Portfolio sandbox</text>

  <!-- Allocation donut -->
  <rect x="40" y="150" width="440" height="270" rx="22" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
  <g transform="translate(150 285) rotate(-90)" fill="none" stroke-width="36">
    <circle r="92" stroke="#147d92" stroke-dasharray="219.6 578" stroke-dashoffset="0"/>
    <circle r="92" stroke="#3b82c4" stroke-dasharray="144.5 578" stroke-dashoffset="-219.6"/>
    <circle r="92" stroke="#3fa66b" stroke-dasharray="115.6 578" stroke-dashoffset="-364.1"/>
    <circle r="92" stroke="#7c6ccf" stroke-dasharray="98.3 578" stroke-dashoffset="-479.7"/>
  </g>
  <text x="150" y="295" text-anchor="middle" font-size="30" font-weight="700" fill="#10233f">Mix</text>
  <g font-size="28" fill="#10233f">
    <rect x="270" y="212" width="22" height="22" rx="5" fill="#147d92"/>
    <text x="306" y="232">Stocks 38%</text>
    <rect x="270" y="262" width="22" height="22" rx="5" fill="#3b82c4"/>
    <text x="306" y="282">Bonds 25%</text>
    <rect x="270" y="312" width="22" height="22" rx="5" fill="#3fa66b"/>
    <text x="306" y="332">Green 20%</text>
    <rect x="270" y="362" width="22" height="22" rx="5" fill="#7c6ccf"/>
    <text x="306" y="382">Cash 17%</text>
  </g>

  <!-- Simulated paths -->
  <rect x="510" y="150" width="410" height="270" rx="22" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
  <line x1="540" y1="390" x2="890" y2="390" stroke="#d4e3e8" stroke-width="2"/>
  <path d="M540 360 C620 340 680 300 740 270 S840 220 890 200" fill="none" stroke="#20a79c" stroke-width="6" stroke-linecap="round"/>
  <path d="M540 360 C620 368 680 372 740 368 S840 358 890 362" fill="none" stroke="#f2b441" stroke-width="6" stroke-linecap="round"/>
  <path d="M540 360 C620 320 680 260 740 230 S840 170 890 156" fill="none" stroke="#7c6ccf" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 12"/>

  <!-- Risk indicators -->
  <g transform="translate(40 440)" font-size="30" font-weight="700" fill="#10233f">
    <rect width="280" height="96" rx="18" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
    <text x="24" y="44">Volatility</text>
    <rect x="24" y="66" width="232" height="14" rx="7" fill="#e1ecf1"/>
    <rect x="24" y="66" width="130" height="14" rx="7" fill="#3b82c4"/>
  </g>
  <g transform="translate(340 440)" font-size="30" font-weight="700" fill="#10233f">
    <rect width="280" height="96" rx="18" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
    <text x="24" y="44">Concentration</text>
    <rect x="24" y="66" width="232" height="14" rx="7" fill="#e1ecf1"/>
    <rect x="24" y="66" width="80" height="14" rx="7" fill="#20a79c"/>
  </g>
  <g transform="translate(640 440)" font-size="30" font-weight="700" fill="#10233f">
    <rect width="280" height="96" rx="18" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
    <text x="24" y="44">Drawdown</text>
    <rect x="24" y="66" width="232" height="14" rx="7" fill="#e1ecf1"/>
    <rect x="24" y="66" width="160" height="14" rx="7" fill="#f2b441"/>
  </g>

  <!-- Hypothetical disclaimer -->
  <g transform="translate(40 552)">
    <rect width="880" height="44" rx="22" fill="#ece8fa"/>
    <text x="440" y="30" text-anchor="middle" font-size="28" font-weight="700" fill="#4b3fa0">HYPOTHETICAL: simulated data, not a forecast</text>
  </g>
</svg>
