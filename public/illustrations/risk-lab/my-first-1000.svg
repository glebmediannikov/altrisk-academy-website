<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">My First $1,000 virtual budget allocation</title>
  <desc id="d">A virtual $1,000 split into savings, spending, and investing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9fb"/>
      <stop offset="1" stop-color="#e5f0f7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>

  <g transform="translate(250 275)">
    <circle r="165" fill="#ffffff"/>
    <circle r="125" fill="none" stroke="#e1ecf1" stroke-width="56"/>
    <g transform="rotate(-90)" fill="none" stroke-width="56">
      <circle r="125" stroke="#20a79c" stroke-dasharray="314.2 785.4" stroke-dashoffset="0"/>
      <circle r="125" stroke="#f2b441" stroke-dasharray="274.9 785.4" stroke-dashoffset="-314.2"/>
      <circle r="125" stroke="#7c6ccf" stroke-dasharray="196.3 785.4" stroke-dashoffset="-589.1"/>
    </g>
    <text y="2" text-anchor="middle" font-size="46" font-weight="700" fill="#10233f">$1,000</text>
    <text y="46" text-anchor="middle" font-size="30" fill="#607587">virtual</text>
  </g>

  <g font-size="36" font-weight="700">
    <g transform="translate(470 110)">
      <rect width="430" height="110" rx="20" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
      <circle cx="58" cy="50" r="30" fill="#20a79c"/>
      <path d="M44 50 h28 M58 36 v28" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <text x="110" y="62" fill="#10233f">Savings</text>
      <text x="400" y="62" text-anchor="end" fill="#147d92">$400</text>
      <rect x="110" y="84" width="290" height="12" rx="6" fill="#e1ecf1"/>
      <rect x="110" y="84" width="116" height="12" rx="6" fill="#20a79c"/>
    </g>
    <g transform="translate(470 240)">
      <rect width="430" height="110" rx="20" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
      <circle cx="58" cy="50" r="30" fill="#f2b441"/>
      <rect x="44" y="41" width="28" height="20" rx="4" fill="#10233f"/>
      <text x="110" y="62" fill="#10233f">Spending</text>
      <text x="400" y="62" text-anchor="end" fill="#b7791f">$350</text>
      <rect x="110" y="84" width="290" height="12" rx="6" fill="#e1ecf1"/>
      <rect x="110" y="84" width="101" height="12" rx="6" fill="#f2b441"/>
    </g>
    <g transform="translate(470 370)">
      <rect width="430" height="110" rx="20" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
      <circle cx="58" cy="50" r="30" fill="#7c6ccf"/>
      <path d="M44 62 L56 48 L64 56 L74 40" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="62" fill="#10233f">Investing</text>
      <text x="400" y="62" text-anchor="end" fill="#6253b8">$250</text>
      <rect x="110" y="84" width="290" height="12" rx="6" fill="#e1ecf1"/>
      <rect x="110" y="84" width="72" height="12" rx="6" fill="#7c6ccf"/>
    </g>
  </g>

  <g transform="translate(60 520)">
    <rect width="840" height="54" rx="27" fill="#10233f"/>
    <text x="420" y="36" text-anchor="middle" font-size="30" fill="#ffffff">Virtual money only</text>
  </g>
</svg>
