<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Unexpected expense and emergency fund scenario</title>
  <desc id="d">A car repair estimate of $850 beside an emergency fund of $1,200 and a savings jar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9fb"/>
      <stop offset="1" stop-color="#e5f0f7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>

  <!-- Road -->
  <rect x="0" y="440" width="960" height="160" fill="#dfe9ef"/>
  <rect x="0" y="440" width="960" height="6" fill="#c3d5de"/>
  <line x1="0" y1="540" x2="960" y2="540" stroke="#ffffff" stroke-width="6" stroke-dasharray="40 30"/>

  <!-- Car -->
  <g transform="translate(50 260)">
    <path d="M10 130 L10 80 Q14 60 50 56 L110 30 Q140 22 200 22 L270 30 Q320 40 340 60 L360 78 L370 130 Z" fill="#3b82c4"/>
    <path d="M124 36 L186 36 L216 62 L118 62 Z" fill="#dff1f7"/>
    <path d="M226 36 L268 40 L300 62 L226 62 Z" fill="#dff1f7"/>
    <circle cx="90" cy="134" r="38" fill="#10233f"/>
    <circle cx="90" cy="134" r="16" fill="#607587"/>
    <circle cx="290" cy="134" r="38" fill="#10233f"/>
    <circle cx="290" cy="134" r="16" fill="#607587"/>
  </g>

  <!-- Warning triangle -->
  <g transform="translate(240 170)">
    <path d="M0 -44 L44 34 L-44 34 Z" fill="#f2b441" stroke="#10233f" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-4" y="-16" width="8" height="28" rx="4" fill="#10233f"/>
    <circle cy="22" r="4.5" fill="#10233f"/>
  </g>

  <!-- Savings jar -->
  <g transform="translate(230 470)">
    <rect x="-70" y="-14" width="140" height="18" rx="6" fill="#20a79c"/>
    <path d="M-60 4 L-60 -10 L60 -10 L60 4 L60 40 Q60 62 36 62 L-36 62 Q-60 62 -60 40 Z" fill="#dff5f1" stroke="#20a79c" stroke-width="4"/>
    <rect x="-44" y="14" width="88" height="40" rx="8" fill="#ffffff"/>
    <text y="43" text-anchor="middle" font-size="28" font-weight="700" fill="#147d92">FUND</text>
  </g>

  <!-- Repair estimate -->
  <g transform="translate(470 50)">
    <rect width="450" height="170" rx="22" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
    <text x="30" y="72" font-size="40" font-weight="700" fill="#10233f">Car repair</text>
    <text x="30" y="132" font-size="48" font-weight="700" fill="#e0785c">$850</text>
  </g>

  <!-- Emergency fund -->
  <g transform="translate(470 290)">
    <rect width="450" height="170" rx="22" fill="#10233f"/>
    <text x="30" y="66" font-size="36" fill="#ffffff">Emergency fund</text>
    <text x="30" y="124" font-size="52" font-weight="700" fill="#ffffff">$1,200</text>
    <text x="420" y="124" text-anchor="end" font-size="30" font-weight="700" fill="#f2b441">$850 covered</text>
    <rect x="30" y="142" width="390" height="12" rx="6" fill="#2b4a6e"/>
    <rect x="30" y="142" width="277" height="12" rx="6" fill="#20a79c"/>
  </g>
</svg>
