<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Responsible consumption choices for home, energy, and transport</title>
  <desc id="d">A house with rooftop solar, an electric car, a bicycle, and a checklist of sustainable choices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9fb"/>
      <stop offset="1" stop-color="#e5f0f7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect x="0" y="470" width="960" height="130" fill="#d7ebe0"/>

  <!-- House -->
  <g transform="translate(90 130)">
    <rect x="30" y="170" width="260" height="170" rx="6" fill="#ffffff" stroke="#10233f" stroke-width="4"/>
    <path d="M10 180 L160 40 L310 180 Z" fill="#3b82c4" stroke="#10233f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 160 L160 84 L250 160 Z" fill="#10233f"/>
    <g stroke="#20a79c" stroke-width="2">
      <line x1="100" y1="144" x2="130" y2="118"/>
      <line x1="160" y1="94" x2="160" y2="160"/>
      <line x1="220" y1="144" x2="190" y2="118"/>
    </g>
    <rect x="70" y="210" width="60" height="60" rx="4" fill="#dff1f7" stroke="#147d92" stroke-width="3"/>
    <rect x="190" y="210" width="60" height="60" rx="4" fill="#dff1f7" stroke="#147d92" stroke-width="3"/>
    <rect x="130" y="260" width="60" height="80" rx="4" fill="#f2b441" stroke="#10233f" stroke-width="3"/>
    <circle cx="180" cy="302" r="4" fill="#10233f"/>
    <circle cx="300" cy="50" r="28" fill="#f2b441"/>
  </g>

  <!-- Electric car -->
  <g transform="translate(470 360)">
    <path d="M0 80 L0 40 Q4 20 40 18 L100 2 Q130 -2 170 4 L220 20 Q250 26 262 50 L270 80 Z" fill="#20a79c"/>
    <path d="M100 22 L150 22 L186 40 L94 40 Z" fill="#dff5f1"/>
    <path d="M196 22 L224 30 L238 44 L196 44 Z" fill="#dff5f1"/>
    <circle cx="60" cy="86" r="28" fill="#10233f"/>
    <circle cx="60" cy="86" r="10" fill="#607587"/>
    <circle cx="210" cy="86" r="28" fill="#10233f"/>
    <circle cx="210" cy="86" r="10" fill="#607587"/>
    <circle cx="136" cy="44" r="16" fill="#f2b441"/>
    <path d="M140 36 L132 46 L139 46 L134 54 L144 42 L137 42 Z" fill="#10233f"/>
  </g>

  <!-- Bicycle -->
  <g transform="translate(790 400)" fill="none" stroke="#10233f" stroke-width="5">
    <circle cx="-30" cy="40" r="26"/>
    <circle cx="50" cy="40" r="26"/>
    <path d="M-30 40 L0 4 L50 40 M0 4 L10 -10 M-6 -8 L14 -8 M0 4 L-6 40 L10 -10" stroke-linejoin="round"/>
  </g>

  <!-- Trees -->
  <rect x="58" y="420" width="12" height="40" fill="#10233f"/>
  <circle cx="64" cy="410" r="30" fill="#3fa66b"/>
  <rect x="880" y="430" width="12" height="36" fill="#10233f"/>
  <circle cx="886" cy="420" r="26" fill="#3fa66b"/>

  <!-- Sustainable choices checklist -->
  <g transform="translate(520 40)">
    <rect width="400" height="250" rx="22" fill="#ffffff" stroke="#d4e3e8" stroke-width="2"/>
    <text x="30" y="62" font-size="30" font-weight="700" fill="#147d92">Sustainable choices</text>
    <g font-size="30" fill="#10233f">
      <circle cx="42" cy="118" r="16" fill="#3fa66b"/>
      <path d="M35 118 L40 123 L49 112" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="74" y="130">Rooftop solar</text>
      <circle cx="42" cy="178" r="16" fill="#3fa66b"/>
      <path d="M35 178 L40 183 L49 172" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="74" y="190">EV or transit</text>
      <circle cx="42" cy="238" r="16" fill="#f2b441"/>
      <text x="74" y="250">Repair and reuse</text>
    </g>
  </g>
</svg>
