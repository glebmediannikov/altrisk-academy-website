<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Liquidity risk and the cost of selling</title>
  <desc id="desc">A portfolio moves from a midpoint quote through a widening spread and decreasing market depth toward uncertain sale proceeds.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/>
  <circle cx="1350" cy="180" r="230" fill="#e3f3f1"/>
  <circle cx="170" cy="770" r="250" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif">
    <text x="120" y="150" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">MARKET &amp; FUNDING LIQUIDITY</text>
    <text x="120" y="215" fill="#10233f" font-size="48" font-weight="700">A quoted value is not cash in hand.</text>
    <text x="120" y="260" fill="#607587" font-size="23">Trade size, timing, and market depth change the exit price.</text>
  </g>
  <rect x="180" y="370" width="320" height="260" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/>
  <text x="340" y="430" text-anchor="middle" fill="#147d92" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="2">MIDPOINT QUOTE</text>
  <text x="340" y="510" text-anchor="middle" fill="#10233f" font-family="Arial,sans-serif" font-size="49" font-weight="700">$100.00</text>
  <text x="340" y="570" text-anchor="middle" fill="#607587" font-family="Arial,sans-serif" font-size="19">reference price</text>
  <path d="M550 500h145" stroke="#147d92" stroke-width="8" stroke-linecap="round"/><path d="m682 480 32 20-32 20z" fill="#147d92"/>
  <rect x="740" y="340" width="340" height="320" rx="28" fill="#10233f"/>
  <text x="910" y="405" text-anchor="middle" fill="#77d9d2" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="2">MARKET DEPTH</text>
  <path d="M820 470h180M840 520h145M860 570h108" stroke="#bde7e2" stroke-width="22" stroke-linecap="round"/>
  <text x="910" y="625" text-anchor="middle" fill="#d9e8ed" font-family="Arial,sans-serif" font-size="18">less available at each level</text>
  <path d="M1115 500h115" stroke="#147d92" stroke-width="8" stroke-linecap="round"/><path d="m1218 480 32 20-32 20z" fill="#147d92"/>
  <rect x="1270" y="370" width="250" height="260" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/>
  <text x="1395" y="435" text-anchor="middle" fill="#147d92" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">PROCEEDS</text>
  <path d="M1320 490h150" stroke="#d7e5e9" stroke-width="3"/>
  <path d="M1320 500h120M1320 525h100M1320 550h80M1320 575h55" stroke="#28a99f" stroke-width="10" stroke-linecap="round"/>
  <text x="1395" y="615" text-anchor="middle" fill="#607587" font-family="Arial,sans-serif" font-size="17">price may vary</text>
  <text x="120" y="805" fill="#607587" font-family="Arial,sans-serif" font-size="19">Conceptual illustration · actual market depth and transaction costs are uncertain.</text>
</svg>
