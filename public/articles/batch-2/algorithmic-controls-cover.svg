<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Algorithmic trading control flow</title>
  <desc id="desc">An electronic order passes through pre-trade checks before approval or rejection and ongoing monitoring.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/>
  <circle cx="1290" cy="180" r="220" fill="#e3f3f1"/>
  <circle cx="170" cy="790" r="250" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="115" y="340" width="265" height="220" rx="26" fill="#fff" stroke="#d5e4e9" stroke-width="4"/>
    <text x="247" y="400" fill="#147d92" font-size="25" font-weight="700" letter-spacing="2">ORDER</text>
    <path d="M180 448h132M180 482h98" stroke="#78909f" stroke-width="12" stroke-linecap="round"/>
    <text x="247" y="530" fill="#10233f" font-size="24" font-weight="700">Strategy</text>
    <path d="M418 448H518" stroke="#147d92" stroke-width="8" stroke-linecap="round"/><path d="m511 429 30 19-30 19z" fill="#147d92"/>
    <rect x="550" y="265" width="310" height="365" rx="34" fill="#10233f"/>
    <text x="705" y="325" fill="#77d9d2" font-size="24" font-weight="700" letter-spacing="2">PRE-TRADE</text>
    <circle cx="705" cy="438" r="75" fill="#193b57" stroke="#52758b" stroke-width="4"/>
    <path d="M705 385v55l39 23" fill="none" stroke="#bdeae4" stroke-width="10" stroke-linecap="round"/>
    <text x="705" y="570" fill="#fff" font-size="25" font-weight="700">Limits + checks</text>
    <path d="M878 448H960" stroke="#147d92" stroke-width="8" stroke-linecap="round"/><path d="m953 429 30 19-30 19z" fill="#147d92"/>
    <rect x="990" y="270" width="230" height="145" rx="24" fill="#e2f5ef" stroke="#a8d8ca" stroke-width="3"/>
    <text x="1105" y="330" fill="#147d92" font-size="24" font-weight="700">APPROVE</text>
    <path d="m1060 365 25 24 52-55" fill="none" stroke="#147d92" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="990" y="480" width="230" height="145" rx="24" fill="#fff0ed" stroke="#e5c4bc" stroke-width="3"/>
    <text x="1105" y="540" fill="#9d5145" font-size="24" font-weight="700">REJECT</text>
    <path d="m1070 560 70 42m0-42-70 42" stroke="#9d5145" stroke-width="9" stroke-linecap="round"/>
    <path d="M1245 340h105v225h-105" fill="none" stroke="#a9c2ca" stroke-width="5" stroke-dasharray="12 10"/>
    <rect x="1350" y="355" width="190" height="190" rx="26" fill="#fff" stroke="#d5e4e9" stroke-width="4"/>
    <text x="1445" y="410" fill="#147d92" font-size="22" font-weight="700">MONITOR</text>
    <path d="M1390 490h32l22-42 24 73 22-48h35" fill="none" stroke="#147d92" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Arial,sans-serif">
    <text x="115" y="150" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">MARKET ACCESS &amp; CONTROL DESIGN</text>
    <text x="115" y="215" fill="#10233f" font-size="48" font-weight="700">Check before release. Monitor after.</text>
    <text x="115" y="790" fill="#607587" font-size="21">Illustrative system design · requirements vary by product, firm, and venue</text>
  </g>
</svg>
