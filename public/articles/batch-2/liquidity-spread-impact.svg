<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hypothetical liquidation through five bid levels</title>
  <desc id="desc">A hypothetical sale of 10,000 shares consumes five bid levels and produces 994,800 dollars, compared with a one-million-dollar midpoint value.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/>
  <text x="56" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">HYPOTHETICAL DEPTH LADDER · 10,000 SHARES</text>
  <text x="56" y="105" font-family="Arial,sans-serif" font-size="18" fill="#52697b">Midpoint reference: $100.00 · midpoint value: $1,000,000</text>
  <g font-family="Arial,sans-serif">
    <text x="84" y="163" font-size="16" font-weight="700" fill="#607587">BID PRICE</text>
    <text x="300" y="163" font-size="16" font-weight="700" fill="#607587">SHARES</text>
    <text x="496" y="163" font-size="16" font-weight="700" fill="#607587">PROCEEDS</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="20" fill="#10233f">
    <text x="92" y="220">$99.90</text><text x="310" y="220">2,000</text><text x="510" y="220">$199,800</text>
    <text x="92" y="284">$99.80</text><text x="310" y="284">2,000</text><text x="510" y="284">$199,600</text>
    <text x="92" y="348">$99.60</text><text x="310" y="348">2,000</text><text x="510" y="348">$199,200</text>
    <text x="92" y="412">$99.30</text><text x="310" y="412">2,000</text><text x="510" y="412">$198,600</text>
    <text x="92" y="476">$98.80</text><text x="310" y="476">2,000</text><text x="510" y="476">$197,600</text>
  </g>
  <g fill="#28a99f">
    <rect x="690" y="195" width="330" height="30" rx="8"/><rect x="690" y="259" width="310" height="30" rx="8"/>
    <rect x="690" y="323" width="270" height="30" rx="8"/><rect x="690" y="387" width="220" height="30" rx="8"/>
    <rect x="690" y="451" width="150" height="30" rx="8"/>
  </g>
  <path d="M80 506H1020" stroke="#cad8df" stroke-width="2"/>
  <rect x="56" y="530" width="1088" height="82" rx="16" fill="#e7eef6"/>
  <text x="86" y="566" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">Total proceeds: $994,800</text>
  <text x="86" y="594" font-family="Arial,sans-serif" font-size="17" fill="#344e63">Difference from midpoint: $5,200 (0.52%) · all prices and depth are hypothetical.</text>
</svg>
