<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hypothetical loss sample showing VaR and expected shortfall</title>
  <desc id="desc">Twenty losses contain sixteen zeros and one each at one, two, three, and five percent. Nearest-rank VaR at 80 percent is zero and the worst-four average is 2.75 percent.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/>
  <text x="56" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">HYPOTHETICAL SAMPLE · 20 EQUALLY WEIGHTED LOSSES</text>
  <text x="56" y="102" font-family="Arial,sans-serif" font-size="17" fill="#52697b">16 × 0% · 1 × 1% · 1 × 2% · 1 × 3% · 1 × 5%</text>
  <path d="M140 485H1080" stroke="#8298a7" stroke-width="3"/>
  <rect x="620" y="145" width="445" height="342" rx="12" fill="#e5f4f2"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#607587" font-size="17">
    <text x="275" y="176">16 days</text><text x="690" y="410">1 day</text><text x="795" y="440">1 day</text><text x="900" y="440">1 day</text><text x="1005" y="440">1 day</text>
  </g>
  <g fill="#94c9c4">
    <rect x="205" y="185" width="140" height="300" rx="10"/>
    <rect x="625" y="465" width="84" height="20" rx="8"/><rect x="730" y="445" width="84" height="40" rx="8"/>
    <rect x="835" y="425" width="84" height="60" rx="8"/><rect x="940" y="385" width="84" height="100" rx="8"/>
  </g>
  <path d="M550 145V515" stroke="#10233f" stroke-width="4" stroke-dasharray="9 7"/>
  <g font-family="Arial,sans-serif" fill="#10233f">
    <text x="395" y="164" font-size="19" font-weight="700">VaR80 = 0%</text>
    <text x="275" y="522" text-anchor="middle" font-size="17" fill="#607587">0% loss</text>
    <text x="667" y="522" text-anchor="middle" font-size="17" fill="#607587">1%</text>
    <text x="772" y="522" text-anchor="middle" font-size="17" fill="#607587">2%</text>
    <text x="877" y="522" text-anchor="middle" font-size="17" fill="#607587">3%</text>
    <text x="982" y="522" text-anchor="middle" font-size="17" fill="#607587">5%</text>
  </g>
  <rect x="150" y="565" width="900" height="60" rx="14" fill="#e7eef6"/>
  <text x="600" y="603" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233f">Worst four: (1% + 2% + 3% + 5%) ÷ 4 = ES80 2.75%</text>
</svg>
