<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Machine-learning anomaly detection in financial data</title>
  <desc id="desc">A transaction stream passes through an analytical model that highlights an unusual point for human review.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/>
  <circle cx="1320" cy="170" r="220" fill="#e3f3f1"/>
  <circle cx="170" cy="770" r="250" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif">
    <text x="115" y="150" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">AI &amp; FINANCIAL RISK</text>
    <text x="115" y="215" fill="#10233f" font-size="48" font-weight="700">Spot the signal. Review the context.</text>
    <text x="115" y="260" fill="#607587" font-size="23">An alert is a question to investigate, not a verdict.</text>
  </g>
  <rect x="140" y="350" width="330" height="300" rx="26" fill="#fff" stroke="#d4e3e8" stroke-width="4"/>
  <text x="305" y="405" text-anchor="middle" fill="#147d92" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">TRANSACTION STREAM</text>
  <g fill="#a9c2cb">
    <circle cx="225" cy="485" r="16"/><circle cx="285" cy="520" r="16"/><circle cx="345" cy="470" r="16"/><circle cx="395" cy="540" r="16"/>
    <circle cx="225" cy="580" r="16"/><circle cx="310" cy="590" r="16"/><circle cx="380" cy="600" r="16"/>
  </g>
  <circle cx="395" cy="450" r="19" fill="#d07855"/>
  <path d="M500 500h110" stroke="#147d92" stroke-width="8" stroke-linecap="round"/><path d="m595 480 32 20-32 20z" fill="#147d92"/>
  <rect x="650" y="350" width="330" height="300" rx="26" fill="#10233f"/>
  <text x="815" y="405" text-anchor="middle" fill="#77d9d2" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">MODEL SCORE</text>
  <circle cx="815" cy="510" r="74" fill="#193b57" stroke="#52758b" stroke-width="4"/>
  <path d="M815 510 868 468" stroke="#28c5b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M755 545a70 70 0 0 1 120-75" fill="none" stroke="#28c5b8" stroke-width="9" stroke-linecap="round"/>
  <text x="815" y="615" text-anchor="middle" fill="#d9e8ed" font-family="Arial,sans-serif" font-size="18">unusual pattern</text>
  <path d="M1010 500h90" stroke="#147d92" stroke-width="8" stroke-linecap="round"/><path d="m1085 480 32 20-32 20z" fill="#147d92"/>
  <rect x="1140" y="350" width="320" height="300" rx="26" fill="#fff" stroke="#d4e3e8" stroke-width="4"/>
  <text x="1300" y="405" text-anchor="middle" fill="#147d92" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">HUMAN REVIEW</text>
  <circle cx="1300" cy="500" r="55" fill="#e2f5ef"/>
  <path d="M1272 500h56M1300 472v56" stroke="#147d92" stroke-width="9" stroke-linecap="round"/>
  <text x="1300" y="600" text-anchor="middle" fill="#10233f" font-family="Arial,sans-serif" font-size="19">context + evidence</text>
  <text x="115" y="790" fill="#607587" font-family="Arial,sans-serif" font-size="19">Illustrative workflow · scores do not establish fraud or intent.</text>
</svg>
