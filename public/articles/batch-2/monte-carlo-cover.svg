    <path d="M570 490C760 520 890 600 1060 665s250 72 390 96" stroke="#7abeb9" stroke-width="6"/>
    <path d="M570 490c190-68 325-118 470-194s274-119 410-141" stroke="#9cbbc4" stroke-width="5"/>
    <path d="M570 490c190 96 320 158 450 213s280 112 430 129" stroke="#b3c9cf" stroke-width="5"/>
    <path d="M570 490c170-110 300-176 430-220s275-60 450-92" stroke="#bfd2d7" stroke-width="4"/>
    <path d="M570 490c170 32 310 64 440 112s292 76 440 91" stroke="#bfd2d7" stroke-width="4"/>
