  <g fill="#147d92"><circle cx="130" cy="490" r="17"/><circle cx="570" cy="490" r="18"/><circle cx="930" cy="365" r="14"/><circle cx="1460" cy="250" r="17"/></g>
  <rect x="990" y="420" width="430" height="220" rx="28" fill="#fff" stroke="#d7e5e9" stroke-width="4"/>
  <path d="M1040 590h320M1060 590c50-12 75-126 145-126s90 126 145 126" fill="none" stroke="#147d92" stroke-width="8" stroke-linecap="round"/>
