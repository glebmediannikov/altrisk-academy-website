  <g font-family="Arial,sans-serif">
    <text x="120" y="140" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">FINANCIAL RISK ANALYTICS</text>
    <text x="120" y="205" fill="#10233f" font-size="48" font-weight="700">Many paths. Stated assumptions.</text>
    <text x="120" y="250" fill="#607587" font-size="24">A simulation explores outcomes; it does not predict one.</text>
