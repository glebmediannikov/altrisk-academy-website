<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio diversification</title><desc id="desc">A single concentrated exposure is contrasted with hypothetical holdings spread across several asset groups.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="165" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="245" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="155" y="330" width="450" height="380" rx="30" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="380" y="395" fill="#9d5145" font-size="24" font-weight="700" letter-spacing="3">CONCENTRATED</text><rect x="300" y="450" width="160" height="155" rx="24" fill="#d07855"/><text x="380" y="520" fill="#fff" font-size="22" font-weight="700">ONE</text><text x="380" y="555" fill="#fff" font-size="22" font-weight="700">HOLDING</text><text x="380" y="665" fill="#607587" font-size="18">one issuer exposure</text>
  <rect x="995" y="330" width="450" height="380" rx="30" fill="#10233f"/><text x="1220" y="395" fill="#77d9d2" font-size="24" font-weight="700" letter-spacing="3">SPREAD EXPOSURE</text><rect x="1075" y="470" width="120" height="135" rx="18" fill="#147d92"/><rect x="1210" y="470" width="95" height="135" rx="18" fill="#28a99f"/><rect x="1320" y="470" width="65" height="135" rx="18" fill="#77c9c2"/><text x="1135" y="545" fill="#fff" font-size="18" font-weight="700">A</text><text x="1257" y="545" fill="#fff" font-size="18" font-weight="700">B</text><text x="1352" y="545" fill="#10233f" font-size="18" font-weight="700">C</text><text x="1220" y="665" fill="#c6d9df" font-size="18">different exposures may behave differently</text></g>
  <path d="M675 525h250" stroke="#147d92" stroke-width="8" stroke-linecap="round"/><path d="m905 505 34 20-34 20z" fill="#147d92"/>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">INVESTING BASICS</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">Spread exposures—not guarantees.</text><text x="115" y="790" fill="#607587" font-size="20">Diversification can reduce concentration risk, but not eliminate market risk.</text></g>
</svg>
