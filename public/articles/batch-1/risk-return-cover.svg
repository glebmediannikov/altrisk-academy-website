<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Risk and return</title><desc id="desc">A conceptual chart shows that an outcome range can widen as an assumed return changes, with outcomes possible above and below the estimate.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="165" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="245" fill="#e7eef6"/>
  <rect x="180" y="300" width="1240" height="390" rx="30" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><path d="M330 610H1300M330 610V370" stroke="#9bb0ba" stroke-width="4"/>
  <path d="M360 495 1260 430" stroke="#147d92" stroke-width="7"/><path d="M360 515 1260 360" stroke="#d07855" stroke-width="7"/><path d="M360 485 1260 545" stroke="#d07855" stroke-width="7" stroke-dasharray="14 12"/>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">INVESTING BASICS</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">A possible reward is never a promise.</text><text x="365" y="650" fill="#607587" font-size="18">Conceptual illustration · wider range means more uncertainty</text><text x="1000" y="405" fill="#147d92" font-size="18">assumed return</text><text x="1010" y="560" fill="#a8573d" font-size="18">possible lower outcome</text><text x="260" y="410" fill="#607587" font-size="17">possible outcomes</text></g>
</svg>
