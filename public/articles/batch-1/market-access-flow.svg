<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Securities order pre-trade control flow</title><desc id="desc">An order is checked for credit or capital limits, erroneous orders, applicable regulatory requirements, and authorized access before approval or rejection and routing.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">ILLUSTRATIVE SECURITIES ORDER FLOW</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="45" y="230" width="160" height="110" rx="18" fill="#10233f"/><text x="125" y="275" fill="#fff" font-size="18" font-weight="700">ORDER</text><text x="125" y="308" fill="#c4e7e5" font-size="15">submitted</text><rect x="250" y="170" width="360" height="230" rx="20" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="430" y="215" fill="#147d92" font-size="18" font-weight="700">PRE-TRADE CONTROL OBJECTIVES</text><text x="430" y="260" fill="#10233f" font-size="16">Credit / capital threshold</text><text x="430" y="295" fill="#10233f" font-size="16">Erroneous-order checks</text><text x="430" y="330" fill="#10233f" font-size="16">Regulatory requirements + access</text><rect x="655" y="175" width="180" height="90" rx="18" fill="#e2f5ef"/><text x="745" y="228" fill="#147d92" font-size="18" font-weight="700">APPROVE</text><rect x="655" y="305" width="180" height="90" rx="18" fill="#fff0ed"/><text x="745" y="358" fill="#9d5145" font-size="18" font-weight="700">REJECT + LOG</text><rect x="885" y="230" width="260" height="110" rx="18" fill="#10233f"/><text x="1015" y="275" fill="#fff" font-size="18" font-weight="700">EXCHANGE / ATS</text><text x="1015" y="308" fill="#c4e7e5" font-size="15">securities venue</text></g>
  <g stroke="#147d92" stroke-width="5" fill="#147d92"><path d="M205 285h38"/><path d="m233 273 18 12-18 12z"/><path d="M610 285h28v-65h12"/><path d="m638 208 18 12-18 12z"/><path d="M835 220h42v65h4"/><path d="m867 273 18 12-18 12z"/></g>
  <rect x="100" y="465" width="1000" height="80" rx="17" fill="#e7eef6"/><text x="600" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233f">SEC Rule 15c3-5: covered broker-dealers with securities market access</text><text x="600" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#52697b">Applicability depends on the legal entity and access arrangement; futures have separate frameworks.</text>
</svg>
