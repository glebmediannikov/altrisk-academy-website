<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Risk management from monitoring to escalation</title><desc id="desc">A cyclical process identifies risks, assesses evidence, assigns responses, monitors indicators, and escalates issues to decision-makers.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="56" y="65" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">RISK WORK CONNECTS ANALYSIS TO ACTION</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="85" y="170" width="270" height="120" rx="20" fill="#10233f"/><text x="220" y="220" fill="#77d9d2" font-size="19" font-weight="700">IDENTIFY</text><text x="220" y="255" fill="#fff" font-size="17">cause · event · effect</text><rect x="465" y="170" width="270" height="120" rx="20" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="600" y="220" fill="#147d92" font-size="19" font-weight="700">ASSESS</text><text x="600" y="255" fill="#52697b" font-size="17">evidence · uncertainty</text><rect x="845" y="170" width="270" height="120" rx="20" fill="#10233f"/><text x="980" y="220" fill="#77d9d2" font-size="19" font-weight="700">RESPOND</text><text x="980" y="255" fill="#fff" font-size="17">owner · trade-off</text><rect x="845" y="410" width="270" height="120" rx="20" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="980" y="460" fill="#147d92" font-size="19" font-weight="700">MONITOR</text><text x="980" y="495" fill="#52697b" font-size="17">indicator · threshold</text><rect x="465" y="410" width="270" height="120" rx="20" fill="#e2f5ef"/><text x="600" y="460" fill="#147d92" font-size="19" font-weight="700">ESCALATE</text><text x="600" y="495" fill="#52697b" font-size="17">decision · follow-up</text></g>
  <g stroke="#147d92" stroke-width="5" fill="#147d92"><path d="M355 230h92"/><path d="m438 216 22 14-22 14z"/><path d="M735 230h92"/><path d="m818 216 22 14-22 14z"/><path d="M980 290v98"/><path d="m966 376 14 22 14-22z"/><path d="M845 470h-92"/><path d="m768 456-22 14 22 14z"/><path d="M465 470H355V300"/><path d="m341 314 14-22 14 22z"/></g>
  <text x="600" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52697b">Business owners, independent risk teams, compliance, and audit have distinct responsibilities.</text>
</svg>
