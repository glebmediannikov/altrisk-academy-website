<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Understanding market volatility</title><desc id="desc">Two hypothetical price paths start and end at the same value but have different interim fluctuations.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="165" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="245" fill="#e7eef6"/>
  <rect x="180" y="300" width="1240" height="390" rx="30" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><path d="M270 610H1330M270 385V610" stroke="#9bb0ba" stroke-width="4"/>
  <path d="M300 510 510 465 720 555 930 485 1140 510" fill="none" stroke="#147d92" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 510 510 410 720 610 930 440 1140 510" fill="none" stroke="#d07855" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">INVESTING BASICS</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">Volatility describes movement—not direction.</text><text x="305" y="665" fill="#52697b" font-size="18">Hypothetical observations · both paths start and end at $100</text><circle cx="1130" cy="365" r="9" fill="#147d92"/><text x="1150" y="372" fill="#10233f" font-size="18">Smaller interim swings</text><circle cx="1130" cy="405" r="9" fill="#d07855"/><text x="1150" y="412" fill="#10233f" font-size="18">Larger interim swings</text></g>
</svg>
