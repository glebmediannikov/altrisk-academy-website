<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The work of a risk manager</title><desc id="desc">A continuous loop links organizational objectives, risk assessment, response, monitoring, and decisions.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="165" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="245" fill="#e7eef6"/>
  <g fill="none" stroke="#a8cbd0" stroke-width="14"><path d="M800 305c170 0 285 92 320 205"/><path d="M1120 510c0 160-140 260-320 260"/><path d="M800 770c-175 0-320-98-320-260"/><path d="M480 510c25-130 150-205 320-205"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="800" cy="305" r="95" fill="#10233f"/><text x="800" y="300" fill="#77d9d2" font-size="20" font-weight="700">OBJECTIVES</text><text x="800" y="333" fill="#fff" font-size="18">what matters</text><circle cx="1120" cy="510" r="95" fill="#fff" stroke="#cbdde3" stroke-width="4"/><text x="1120" y="505" fill="#147d92" font-size="20" font-weight="700">ASSESS</text><text x="1120" y="538" fill="#52697b" font-size="18">evidence + impact</text><circle cx="800" cy="770" r="95" fill="#10233f"/><text x="800" y="765" fill="#77d9d2" font-size="20" font-weight="700">RESPOND</text><text x="800" y="798" fill="#fff" font-size="18">trade-offs + owners</text><circle cx="480" cy="510" r="95" fill="#fff" stroke="#cbdde3" stroke-width="4"/><text x="480" y="505" fill="#147d92" font-size="20" font-weight="700">MONITOR</text><text x="480" y="538" fill="#52697b" font-size="18">signals + follow-up</text></g>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">RISK CAREERS</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">Make uncertainty useful to decisions.</text><text x="115" y="845" fill="#607587" font-size="20">Roles and reporting structures vary by organization and industry.</text></g>
</svg>
