<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI risk management lifecycle</title><desc id="desc">Define purpose, assess data, test the system, approve controls, use human oversight, and monitor outcomes after release.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="55" y="66" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">A CONTROLLED AI LIFECYCLE</text>
  <path d="M145 290H1055" stroke="#bfd7dc" stroke-width="7" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="145" cy="290" r="65" fill="#10233f"/><text x="145" y="285" fill="#fff" font-size="16" font-weight="700">PURPOSE</text><text x="145" y="390" fill="#52697b" font-size="15">decision + impact</text></g><g><circle cx="327" cy="290" r="65" fill="#e2f5ef" stroke="#a8d8ca" stroke-width="3"/><text x="327" y="285" fill="#147d92" font-size="16" font-weight="700">DATA</text><text x="327" y="390" fill="#52697b" font-size="15">quality + rights</text></g><g><circle cx="509" cy="290" r="65" fill="#10233f"/><text x="509" y="285" fill="#fff" font-size="16" font-weight="700">TEST</text><text x="509" y="390" fill="#52697b" font-size="15">errors + limits</text></g><g><circle cx="691" cy="290" r="65" fill="#e2f5ef" stroke="#a8d8ca" stroke-width="3"/><text x="691" y="285" fill="#147d92" font-size="16" font-weight="700">APPROVE</text><text x="691" y="390" fill="#52697b" font-size="15">owner + fallback</text></g><g><circle cx="873" cy="290" r="65" fill="#10233f"/><text x="873" y="285" fill="#fff" font-size="16" font-weight="700">OVERSEE</text><text x="873" y="390" fill="#52697b" font-size="15">human review</text></g><g><circle cx="1055" cy="290" r="65" fill="#e2f5ef" stroke="#a8d8ca" stroke-width="3"/><text x="1055" y="285" fill="#147d92" font-size="16" font-weight="700">MONITOR</text><text x="1055" y="390" fill="#52697b" font-size="15">drift + incidents</text></g></g>
  <g fill="#147d92"><path d="m220 281 17 9-17 9z"/><path d="m402 281 17 9-17 9z"/><path d="m584 281 17 9-17 9z"/><path d="m766 281 17 9-17 9z"/><path d="m948 281 17 9-17 9z"/></g>
  <rect x="140" y="470" width="920" height="86" rx="18" fill="#e7eef6"/><text x="600" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233f">Scale review to purpose, potential impact, and reversibility.</text><text x="600" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#52697b">Illustrative good practice; specific obligations depend on the organization and use.</text>
</svg>
