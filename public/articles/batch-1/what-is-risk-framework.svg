<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A practical risk statement</title><desc id="desc">A goal is connected to an uncertain event and possible consequence, with evidence about likelihood considered separately from impact.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="56" y="65" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="2" fill="#147d92">A PRACTICAL RISK STATEMENT</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="80" y="190" width="255" height="145" rx="18" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="207" y="245" font-size="20" font-weight="700" fill="#147d92">GOAL</text><text x="207" y="288" font-size="19" fill="#10233f">Pay a course fee</text><rect x="470" y="190" width="255" height="145" rx="18" fill="#10233f"/><text x="597" y="245" font-size="20" font-weight="700" fill="#77d9d2">UNCERTAIN EVENT</text><text x="597" y="288" font-size="19" fill="#fff">Unexpected repair</text><rect x="860" y="190" width="255" height="145" rx="18" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="987" y="245" font-size="20" font-weight="700" fill="#147d92">CONSEQUENCE</text><text x="987" y="288" font-size="19" fill="#10233f">Less money available</text></g>
  <path d="M335 262h118m272 0h118" stroke="#147d92" stroke-width="6" stroke-linecap="round"/><g fill="#147d92"><path d="m444 246 24 16-24 16z"/><path d="m834 246 24 16-24 16z"/></g>
  <rect x="90" y="400" width="485" height="125" rx="18" fill="#e7eef6"/><text x="120" y="442" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">LIKELIHOOD</text><text x="120" y="478" font-family="Arial,sans-serif" font-size="17" fill="#52697b">What evidence informs the chance?</text>
  <rect x="625" y="400" width="485" height="125" rx="18" fill="#e2f5ef"/><text x="655" y="442" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233f">IMPACT</text><text x="655" y="478" font-family="Arial,sans-serif" font-size="17" fill="#52697b">How much could the goal be affected?</text>
  <text x="600" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52697b">Example is conceptual; it does not estimate the probability of a repair.</text>
</svg>
