<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hypothetical first-order bond duration sensitivity</title><desc id="desc">A ten-million-dollar portfolio with modified duration four under a 1 percentage point yield increase gives an approximate four percent price decrease, or 400,000 dollars.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">HYPOTHETICAL RATE SENSITIVITY</text>
  <rect x="70" y="145" width="320" height="130" rx="20" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="230" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52697b">PORTFOLIO VALUE</text><text x="230" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233f">$10 million</text>
  <rect x="440" y="145" width="320" height="130" rx="20" fill="#10233f"/><text x="600" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#c4e7e5">MODIFIED DURATION</text><text x="600" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">4.0</text>
  <rect x="810" y="145" width="320" height="130" rx="20" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="970" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52697b">YIELD SHOCK</text><text x="970" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233f">+1 percentage point</text>
  <rect x="130" y="340" width="940" height="112" rx="20" fill="#e2f5ef"/><text x="600" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233f">Approximate price change ≈ −duration × yield change</text><text x="600" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#147d92">−4.0 × 0.01 = −4% ≈ −$400,000</text>
  <text x="600" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#52697b">First-order approximation only; excludes convexity, spread moves, cash flows, hedges, and other effects.</text>
</svg>
