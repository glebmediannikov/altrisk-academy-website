<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What is risk?</title><desc id="desc">A goal, an uncertain event, and its possible impact form a practical risk statement.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1330" cy="170" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="250" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="120" y="350" width="350" height="270" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="295" y="425" fill="#147d92" font-size="25" font-weight="700" letter-spacing="3">OBJECTIVE</text><circle cx="295" cy="510" r="48" fill="#e2f5ef"/><path d="M265 510h60m-30-30v60" stroke="#147d92" stroke-width="9" stroke-linecap="round"/><text x="295" y="585" fill="#10233f" font-size="25" font-weight="700">What matters?</text>
    <path d="M500 485h145" stroke="#147d92" stroke-width="8" stroke-linecap="round"/><path d="m632 465 32 20-32 20z" fill="#147d92"/>
    <rect x="680" y="350" width="350" height="270" rx="28" fill="#10233f"/><text x="855" y="425" fill="#77d9d2" font-size="25" font-weight="700" letter-spacing="3">UNCERTAINTY</text><path d="M790 510h130M855 445v130" stroke="#bce8e2" stroke-width="10" stroke-linecap="round"/><circle cx="855" cy="510" r="45" fill="none" stroke="#bce8e2" stroke-width="6"/><text x="855" y="585" fill="#fff" font-size="25" font-weight="700">What could change?</text>
    <path d="M1060 485h145" stroke="#147d92" stroke-width="8" stroke-linecap="round"/><path d="m1192 465 32 20-32 20z" fill="#147d92"/>
    <rect x="1240" y="350" width="250" height="270" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="1365" y="425" fill="#147d92" font-size="24" font-weight="700" letter-spacing="2">IMPACT</text><path d="m1320 520 30-45 30 28 30-62" fill="none" stroke="#147d92" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="1365" y="585" fill="#10233f" font-size="22" font-weight="700">What follows?</text>
  </g><g font-family="Arial,sans-serif"><text x="120" y="150" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">RISK FOUNDATIONS</text><text x="120" y="215" fill="#10233f" font-size="50" font-weight="700">Connect uncertainty to what matters.</text><text x="120" y="760" fill="#607587" font-size="21">Likelihood and impact are separate questions; evidence and context matter.</text></g>
</svg>
