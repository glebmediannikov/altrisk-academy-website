<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Model risk governance lifecycle</title><desc id="desc">Inventory, risk-based review, approval, monitoring, and change control are connected by review and escalation.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">ILLUSTRATIVE MODEL LIFECYCLE</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="65" y="200" width="190" height="140" rx="20" fill="#10233f"/><text x="160" y="255" fill="#fff" font-size="18" font-weight="700">INVENTORY</text><text x="160" y="293" fill="#c4e7e5" font-size="15">use · owner</text><rect x="290" y="200" width="190" height="140" rx="20" fill="#e2f5ef"/><text x="385" y="255" fill="#147d92" font-size="18" font-weight="700">ASSESS</text><text x="385" y="293" fill="#52697b" font-size="15">risk · complexity</text><rect x="515" y="200" width="190" height="140" rx="20" fill="#10233f"/><text x="610" y="255" fill="#fff" font-size="18" font-weight="700">APPROVE</text><text x="610" y="293" fill="#c4e7e5" font-size="15">scope · limits</text><rect x="740" y="200" width="190" height="140" rx="20" fill="#e2f5ef"/><text x="835" y="255" fill="#147d92" font-size="18" font-weight="700">MONITOR</text><text x="835" y="293" fill="#52697b" font-size="15">outcomes · drift</text><rect x="965" y="200" width="190" height="140" rx="20" fill="#10233f"/><text x="1060" y="255" fill="#fff" font-size="18" font-weight="700">CHANGE</text><text x="1060" y="293" fill="#c4e7e5" font-size="15">review · retire</text></g>
  <g fill="#147d92"><path d="m260 260 19 10-19 10z"/><path d="m485 260 19 10-19 10z"/><path d="m710 260 19 10-19 10z"/><path d="m935 260 19 10-19 10z"/></g>
  <path d="M1060 365v100H160V365" fill="none" stroke="#8eb8bc" stroke-width="4" stroke-dasharray="10 8"/><path d="m146 378 14-22 14 22z" fill="#147d92"/>
  <rect x="225" y="445" width="770" height="90" rx="18" fill="#fff" stroke="#cbdde3" stroke-width="2"/><text x="610" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233f">Document evidence, limitations, accountable owners, and actions.</text><text x="610" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#52697b">The 2026 interagency guidance describes supervisory guidance, not a new statute.</text>
</svg>
