<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SEC securities market access controls</title><desc id="desc">A broker-dealer checks an order for financial, regulatory, and authorization risks before routing it to a securities venue.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="165" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="245" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="125" y="365" width="330" height="230" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="290" y="425" fill="#147d92" font-size="22" font-weight="700">ORDER</text><path d="M220 485h140M220 520h105" stroke="#91a8b5" stroke-width="12" stroke-linecap="round"/><text x="290" y="565" fill="#10233f" font-size="20">customer / strategy</text>
  <rect x="625" y="300" width="370" height="360" rx="30" fill="#10233f"/><text x="810" y="365" fill="#77d9d2" font-size="22" font-weight="700">BROKER-DEALER</text><circle cx="810" cy="485" r="75" fill="#193b57" stroke="#52758b" stroke-width="4"/><path d="m774 485 24 24 51-57" fill="none" stroke="#bce8e2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="810" y="595" fill="#fff" font-size="20">documented controls</text>
  <rect x="1165" y="365" width="310" height="230" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="1320" y="425" fill="#147d92" font-size="22" font-weight="700">SECURITIES VENUE</text><path d="M1230 500h180M1255 535h130" stroke="#147d92" stroke-width="10" stroke-linecap="round"/><text x="1320" y="565" fill="#10233f" font-size="20">exchange / ATS</text></g>
  <g stroke="#147d92" stroke-width="8" stroke-linecap="round"><path d="M475 480h135"/><path d="M1010 480h130"/></g><g fill="#147d92"><path d="m590 461 32 19-32 19z"/><path d="m1120 461 32 19-32 19z"/></g>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">SECURITIES MARKET ACCESS</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">Control the order path before release.</text><text x="115" y="790" fill="#607587" font-size="20">SEC Rule 15c3-5 applies to covered broker-dealers—not every futures participant.</text></g>
</svg>
