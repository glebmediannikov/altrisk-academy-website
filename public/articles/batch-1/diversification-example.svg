<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hypothetical concentration-loss comparison</title><desc id="desc">If a 1,000-dollar single holding falls 30 percent, it leaves 700 dollars. In a separate hypothetical portfolio, 100 dollars falls 30 percent while 900 dollars is unchanged, leaving 970 dollars.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">HYPOTHETICAL 30% DECLINE IN ONE HOLDING</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="75" y="150" width="485" height="355" rx="22" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="317" y="205" font-size="20" font-weight="700" fill="#10233f">ALL $1,000 IN ONE HOLDING</text><rect x="160" y="265" width="310" height="44" rx="10" fill="#d07855"/><text x="315" y="295" font-size="16" font-weight="700" fill="#fff">$1,000 before</text><rect x="160" y="350" width="217" height="44" rx="10" fill="#147d92"/><text x="267" y="380" font-size="16" font-weight="700" fill="#fff">$700 after</text><text x="317" y="455" font-size="18" fill="#52697b">loss: $300</text>
  <rect x="640" y="150" width="485" height="355" rx="22" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="882" y="205" font-size="20" font-weight="700" fill="#10233f">ONLY $100 IN THAT HOLDING</text><rect x="720" y="265" width="310" height="44" rx="10" fill="#d07855"/><rect x="751" y="265" width="279" height="44" rx="10" fill="#8bc9c2"/><text x="880" y="295" font-size="16" font-weight="700" fill="#10233f">$100 exposed + $900 unchanged</text><rect x="720" y="350" width="300" height="44" rx="10" fill="#147d92"/><text x="870" y="380" font-size="16" font-weight="700" fill="#fff">$970 after</text><text x="882" y="455" font-size="18" fill="#52697b">loss: $30</text></g>
  <rect x="90" y="540" width="1020" height="70" rx="16" fill="#e7eef6"/><text x="600" y="583" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#344e63">Illustrative arithmetic only: assumes the other $900 does not change; it is not a forecast or allocation recommendation.</text>
</svg>
