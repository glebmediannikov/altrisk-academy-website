<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stress testing financial risk</title><desc id="desc">A hypothetical adverse scenario is translated through exposures into a modeled result and decision action.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="165" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="245" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="120" y="370" width="345" height="245" rx="28" fill="#10233f"/><text x="292" y="430" fill="#77d9d2" font-size="23" font-weight="700">SCENARIO</text><path d="m190 535 65-48 54 28 75-90" fill="none" stroke="#c3e9e4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="580" fill="#fff" font-size="19">specified market shock</text><rect x="625" y="370" width="345" height="245" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="797" y="430" fill="#147d92" font-size="23" font-weight="700">TRANSLATE</text><circle cx="797" cy="510" r="55" fill="#e7eef6"/><path d="M765 510h64M797 478v64" stroke="#147d92" stroke-width="8"/><text x="797" y="580" fill="#52697b" font-size="19">portfolio + assumptions</text><rect x="1130" y="370" width="345" height="245" rx="28" fill="#10233f"/><text x="1302" y="430" fill="#77d9d2" font-size="23" font-weight="700">DECIDE</text><path d="M1245 535h115M1302 478v60" stroke="#c3e9e4" stroke-width="8" stroke-linecap="round"/><text x="1302" y="580" fill="#fff" font-size="19">review action + resilience</text></g>
  <g stroke="#147d92" stroke-width="8" stroke-linecap="round"><path d="M485 492h120"/><path d="M995 492h120"/></g><g fill="#147d92"><path d="m590 473 32 19-32 19z"/><path d="m1100 473 32 19-32 19z"/></g>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">STRESS TESTING</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">Ask “what if?”—not “what will happen?”</text><text x="115" y="790" fill="#607587" font-size="20">Scenario results depend on specified conditions and model assumptions.</text></g>
</svg>
