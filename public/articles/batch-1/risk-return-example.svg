<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative return ranges are not guaranteed outcomes</title><desc id="desc">Two hypothetical outcome intervals overlap and include values below zero, illustrating that assumed higher return does not guarantee a positive result.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">CONCEPTUAL HYPOTHETICAL OUTCOMES</text>
  <path d="M150 485H1060" stroke="#8298a7" stroke-width="3"/><path d="M575 180V510" stroke="#9d5145" stroke-width="3" stroke-dasharray="10 8"/><text x="550" y="545" font-family="Arial,sans-serif" font-size="16" fill="#9d5145">0%</text>
  <g font-family="Arial,sans-serif"><text x="100" y="280" font-size="19" font-weight="700" fill="#10233f">Illustration A</text><text x="100" y="315" font-size="16" fill="#52697b">narrower example range</text><text x="100" y="405" font-size="19" font-weight="700" fill="#10233f">Illustration B</text><text x="100" y="440" font-size="16" fill="#52697b">wider example range</text></g>
  <path d="M460 295H760" stroke="#147d92" stroke-width="25" stroke-linecap="round"/><circle cx="610" cy="295" r="14" fill="#10233f"/>
  <path d="M310 420H915" stroke="#d07855" stroke-width="25" stroke-linecap="round"/><circle cx="690" cy="420" r="14" fill="#10233f"/>
  <text x="600" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52697b">Ranges are conceptual, not market data, forecasts, or investment comparisons.</text>
</svg>
