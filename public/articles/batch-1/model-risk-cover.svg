<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Model risk management guidance</title><desc id="desc">A model inventory, risk-based review, approval, monitoring, and change control form a governed lifecycle.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="165" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="245" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="140" y="365" width="280" height="215" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="280" y="425" fill="#147d92" font-size="22" font-weight="700">INVENTORY</text><path d="M225 475h110M225 510h80" stroke="#90a7b3" stroke-width="12" stroke-linecap="round"/><text x="280" y="550" fill="#52697b" font-size="18">use + owner</text><rect x="520" y="315" width="310" height="315" rx="30" fill="#10233f"/><text x="675" y="380" fill="#77d9d2" font-size="22" font-weight="700">RISK-BASED REVIEW</text><circle cx="675" cy="485" r="68" fill="#193b57" stroke="#52758b" stroke-width="4"/><path d="M675 445v45l30 17" fill="none" stroke="#bce8e2" stroke-width="9" stroke-linecap="round"/><text x="675" y="590" fill="#fff" font-size="18">impact + complexity</text><rect x="930" y="365" width="280" height="215" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="1070" y="425" fill="#147d92" font-size="22" font-weight="700">OVERSIGHT</text><path d="M1015 490h110M1015 525h80" stroke="#28a99f" stroke-width="12" stroke-linecap="round"/><text x="1070" y="550" fill="#52697b" font-size="18">monitor + update</text><rect x="1300" y="390" width="185" height="165" rx="26" fill="#e2f5ef"/><text x="1392" y="455" fill="#147d92" font-size="18" font-weight="700">DECISION</text><path d="m1355 490 24 24 50-55" fill="none" stroke="#147d92" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g stroke="#147d92" stroke-width="8" stroke-linecap="round"><path d="M435 475h75"/><path d="M845 475h75"/><path d="M1225 475h65"/></g><g fill="#147d92"><path d="m490 456 32 19-32 19z"/><path d="m900 456 32 19-32 19z"/><path d="m1270 456 32 19-32 19z"/></g>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">MODEL RISK</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">Oversight should fit the model and its use.</text><text x="115" y="790" fill="#607587" font-size="20">Illustrative practice; supervisory scope and guidance are not universal law.</text></g>
</svg>
