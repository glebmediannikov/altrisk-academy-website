<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI in risk management</title><desc id="desc">Data enter a model, results receive human review, and monitored outcomes inform future controls.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="165" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="245" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="125" y="355" width="300" height="250" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="275" y="420" fill="#147d92" font-size="24" font-weight="700">DATA</text><path d="M205 475h140M205 515h110M205 555h130" stroke="#9eb4bf" stroke-width="12" stroke-linecap="round"/><rect x="530" y="300" width="350" height="360" rx="32" fill="#10233f"/><text x="705" y="370" fill="#77d9d2" font-size="24" font-weight="700">MODEL</text><circle cx="705" cy="490" r="72" fill="#193b57" stroke="#52758b" stroke-width="4"/><path d="M665 490h80M705 450v80" stroke="#bce8e2" stroke-width="8" stroke-linecap="round"/><text x="705" y="605" fill="#fff" font-size="21">score + uncertainty</text><rect x="995" y="355" width="300" height="250" rx="28" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="1145" y="420" fill="#147d92" font-size="24" font-weight="700">HUMAN REVIEW</text><circle cx="1145" cy="500" r="45" fill="#e2f5ef"/><path d="m1125 500 15 15 29-34" fill="none" stroke="#147d92" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="1145" y="570" fill="#52697b" font-size="18">context + decision</text><rect x="1370" y="390" width="175" height="185" rx="25" fill="#e7eef6"/><text x="1457" y="455" fill="#10233f" font-size="18" font-weight="700">MONITOR</text><path d="M1410 510h25l15-25 20 48 18-31h20" fill="none" stroke="#147d92" stroke-width="5"/></g>
  <g stroke="#147d92" stroke-width="8" stroke-linecap="round"><path d="M445 480h65"/><path d="M900 480h75"/><path d="M1315 480h45"/></g><g fill="#147d92"><path d="m500 461 30 19-30 19z"/><path d="m965 461 30 19-30 19z"/><path d="m1350 461 30 19-30 19z"/></g>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">AI &amp; TECHNOLOGY</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">Automation needs governance.</text><text x="115" y="790" fill="#607587" font-size="20">Potential assistance is not proof of accuracy or suitability.</text></g>
</svg>
