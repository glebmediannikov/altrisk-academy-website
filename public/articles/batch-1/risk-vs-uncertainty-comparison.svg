<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Known probability model versus unknown demand</title><desc id="desc">A fair die has six known equally likely outcomes under an assumption; new product demand has plausible outcomes but no established probability model.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">COMPARE THE EVIDENCE, NOT JUST THE LABEL</text>
  <rect x="55" y="125" width="520" height="365" rx="20" fill="#fff" stroke="#cbdde3" stroke-width="3"/><rect x="625" y="125" width="520" height="365" rx="20" fill="#10233f"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="315" y="180" font-size="21" font-weight="700" fill="#147d92">FAIR DIE (ASSUMPTION)</text><text x="315" y="220" font-size="17" fill="#52697b">6 outcomes · equal likelihood model</text><text x="885" y="180" font-size="21" font-weight="700" fill="#77d9d2">NEW PRODUCT</text><text x="885" y="220" font-size="17" fill="#c8dce2">demand, repeat purchases, competitors</text></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="21" fill="#10233f"><text x="145" y="300">1</text><text x="250" y="300">2</text><text x="355" y="300">3</text><text x="460" y="300">4</text><text x="195" y="385">5</text><text x="435" y="385">6</text></g>
  <g fill="#28c5b8"><circle cx="145" cy="270" r="17"/><circle cx="250" cy="270" r="17"/><circle cx="355" cy="270" r="17"/><circle cx="460" cy="270" r="17"/><circle cx="195" cy="355" r="17"/><circle cx="435" cy="355" r="17"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#fff"><text x="885" y="300" font-size="18">Small interest</text><text x="885" y="345" font-size="18">Moderate interest</text><text x="885" y="390" font-size="18">High interest</text><text x="885" y="445" font-size="16" fill="#c8dce2">Collect evidence; avoid false precision.</text></g>
  <rect x="100" y="535" width="1000" height="72" rx="16" fill="#e7eef6"/><text x="600" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#344e63">1 ÷ 6 ≈ 16.7% follows only if the die is fair; a small survey is not a market-wide probability.</text>
</svg>
