<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Understanding financial risk</title><desc id="desc">A financial goal is affected by market, income, liquidity, borrowing cost, and unexpected-expense risks over time.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1310" cy="165" r="225" fill="#e3f3f1"/><circle cx="170" cy="780" r="245" fill="#e7eef6"/>
  <circle cx="800" cy="510" r="125" fill="#10233f"/><text x="800" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#77d9d2">FINANCIAL</text><text x="800" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">GOAL</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="180" y="340" width="290" height="130" rx="24" fill="#fff" stroke="#d4e3e8" stroke-width="3"/><text x="325" y="395" fill="#147d92" font-size="22" font-weight="700">MARKET</text><text x="325" y="430" fill="#52697b" font-size="17">value may change</text><rect x="1130" y="340" width="290" height="130" rx="24" fill="#fff" stroke="#d4e3e8" stroke-width="3"/><text x="1275" y="395" fill="#147d92" font-size="22" font-weight="700">INCOME</text><text x="1275" y="430" fill="#52697b" font-size="17">cash flow interruption</text><rect x="180" y="585" width="290" height="130" rx="24" fill="#fff" stroke="#d4e3e8" stroke-width="3"/><text x="325" y="640" fill="#147d92" font-size="22" font-weight="700">LIQUIDITY</text><text x="325" y="675" fill="#52697b" font-size="17">access and timing</text><rect x="1130" y="585" width="290" height="130" rx="24" fill="#fff" stroke="#d4e3e8" stroke-width="3"/><text x="1275" y="640" fill="#147d92" font-size="22" font-weight="700">EXPENSES</text><text x="1275" y="675" fill="#52697b" font-size="17">unexpected obligations</text></g>
  <g stroke="#87b9bd" stroke-width="5"><path d="M470 405 690 475"/><path d="m1130 405-220 70"/><path d="m470 650 220-90"/><path d="m1130 650-220-90"/></g>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">FINANCIAL RISK</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">Goals, money, uncertainty, and time.</text><text x="115" y="800" fill="#607587" font-size="20">One event can affect multiple parts of a financial plan.</text></g>
</svg>
