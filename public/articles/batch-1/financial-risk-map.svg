<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Financial goal and timing map</title><desc id="desc">A two-month savings goal may be affected by an unexpected repair before the goal date; accessible cash, income, and market value are distinct factors.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6fafb"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#147d92">A GOAL HAS A TIME HORIZON</text>
  <path d="M140 315H1060" stroke="#a9c5cc" stroke-width="7" stroke-linecap="round"/><circle cx="190" cy="315" r="18" fill="#147d92"/><circle cx="590" cy="315" r="18" fill="#d07855"/><circle cx="1010" cy="315" r="18" fill="#147d92"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="190" y="265" font-size="19" font-weight="700" fill="#10233f">TODAY</text><text x="590" y="265" font-size="19" font-weight="700" fill="#10233f">POSSIBLE EVENT</text><text x="1010" y="265" font-size="19" font-weight="700" fill="#10233f">GOAL DATE</text><text x="190" y="365" font-size="17" fill="#52697b">Funds available</text><text x="590" y="365" font-size="17" fill="#52697b">Unexpected repair</text><text x="1010" y="365" font-size="17" fill="#52697b">Fee due</text></g>
  <rect x="110" y="435" width="435" height="105" rx="18" fill="#fff" stroke="#cbdde3" stroke-width="3"/><text x="145" y="477" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#147d92">EXPOSURE</text><text x="145" y="512" font-family="Arial,sans-serif" font-size="17" fill="#52697b">How could cash needs change?</text>
  <rect x="655" y="435" width="435" height="105" rx="18" fill="#e2f5ef"/><text x="690" y="477" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#147d92">RESPONSE OPTIONS</text><text x="690" y="512" font-family="Arial,sans-serif" font-size="17" fill="#52697b">Review timing, resources, and trade-offs.</text>
  <text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#607587">Conceptual timeline; it does not recommend an account or estimate an event probability.</text>
</svg>
