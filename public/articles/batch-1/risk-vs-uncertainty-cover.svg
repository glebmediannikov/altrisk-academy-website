<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Risk versus uncertainty</title><desc id="desc">A fair die with a stated probability contrasts with a new product whose demand probabilities are not known reliably.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="160" r="225" fill="#e3f3f1"/><circle cx="170" cy="770" r="250" fill="#e7eef6"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="175" y="340" width="500" height="365" rx="32" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><text x="425" y="405" fill="#147d92" font-size="24" font-weight="700" letter-spacing="3">ESTIMABLE MODEL</text><rect x="365" y="450" width="120" height="120" rx="22" fill="#10233f"/><g fill="#bce8e2"><circle cx="395" cy="480" r="9"/><circle cx="455" cy="540" r="9"/><circle cx="455" cy="480" r="9"/><circle cx="395" cy="540" r="9"/></g><text x="425" y="625" fill="#10233f" font-size="27" font-weight="700">1 favorable side ÷ 6</text><text x="425" y="665" fill="#607587" font-size="20">if the die is fair</text>
  <rect x="925" y="340" width="500" height="365" rx="32" fill="#10233f"/><text x="1175" y="405" fill="#77d9d2" font-size="24" font-weight="700" letter-spacing="3">UNKNOWN MARKET</text><path d="M1085 520h180M1175 455v130" stroke="#bce8e2" stroke-width="9" stroke-linecap="round"/><circle cx="1175" cy="520" r="45" fill="none" stroke="#bce8e2" stroke-width="6"/><text x="1175" y="625" fill="#fff" font-size="27" font-weight="700">New product demand</text><text x="1175" y="665" fill="#c6d9df" font-size="20">probabilities not established</text></g>
  <g font-family="Arial,sans-serif"><text x="120" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">RISK &amp; UNCERTAINTY</text><text x="120" y="220" fill="#10233f" font-size="49" font-weight="700">Know what you know—and what you don’t.</text><text x="120" y="790" fill="#607587" font-size="20">A precise calculation cannot repair an unsupported probability assumption.</text></g>
</svg>
