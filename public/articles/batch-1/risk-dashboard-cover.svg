<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Risk dashboard design</title><desc id="desc">A conceptual dashboard connects a risk measure to its current value, timestamp, threshold, and owner.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/><circle cx="1320" cy="165" r="220" fill="#e3f3f1"/><circle cx="170" cy="770" r="245" fill="#e7eef6"/>
  <rect x="260" y="285" width="1080" height="435" rx="30" fill="#fff" stroke="#d4e3e8" stroke-width="4"/><rect x="260" y="285" width="1080" height="78" rx="30" fill="#10233f"/><text x="315" y="335" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">EXPOSURE MONITOR</text><text x="1240" y="335" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#c4e7e5">AS OF 10:30 · HYPOTHETICAL</text>
  <rect x="315" y="405" width="285" height="235" rx="20" fill="#f6fafb"/><text x="345" y="450" font-family="Arial,sans-serif" font-size="16" fill="#607587">LIMIT UTILIZATION</text><text x="345" y="510" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#10233f">75%</text><rect x="345" y="550" width="220" height="20" rx="10" fill="#dce8eb"/><rect x="345" y="550" width="165" height="20" rx="10" fill="#28a99f"/><text x="345" y="610" font-family="Arial,sans-serif" font-size="15" fill="#52697b">owner: risk team</text>
  <rect x="630" y="405" width="285" height="235" rx="20" fill="#f6fafb"/><text x="660" y="450" font-family="Arial,sans-serif" font-size="16" fill="#607587">DATA FRESHNESS</text><circle cx="690" cy="510" r="12" fill="#28a99f"/><text x="715" y="518" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233f">current</text><text x="660" y="570" font-family="Arial,sans-serif" font-size="15" fill="#52697b">source + refresh</text><text x="660" y="605" font-family="Arial,sans-serif" font-size="15" fill="#52697b">clearly identified</text>
  <rect x="945" y="405" width="340" height="235" rx="20" fill="#e2f5ef"/><text x="975" y="450" font-family="Arial,sans-serif" font-size="16" fill="#607587">NEXT STEP</text><text x="975" y="505" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233f">Check threshold</text><text x="975" y="545" font-family="Arial,sans-serif" font-size="16" fill="#52697b">Defined owner and</text><text x="975" y="575" font-family="Arial,sans-serif" font-size="16" fill="#52697b">escalation path</text>
  <g font-family="Arial,sans-serif"><text x="115" y="145" fill="#147d92" font-size="25" font-weight="700" letter-spacing="4">RISK REPORTING</text><text x="115" y="215" fill="#10233f" font-size="50" font-weight="700">A useful metric has context and an owner.</text><text x="115" y="790" fill="#607587" font-size="20">Conceptual dashboard; sample values are not real exposure data.</text></g>
</svg>
