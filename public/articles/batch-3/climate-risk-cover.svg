<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Climate risk and financial decisions</title>
  <desc id="desc">Two broad channels of climate risk: physical risk from extreme weather and transition risk from policy and technology change.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#10233f">Climate risk</text>
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="52" fill="#607587">Two channels that affect money decisions</text>

  <rect x="80" y="260" width="700" height="520" rx="28" fill="#ffffff" stroke="#2f6fb3" stroke-width="4"/>
  <path d="M120 520 L260 420 L340 470 L460 340 L580 410 L700 330" fill="none" stroke="#2f6fb3" stroke-width="8" stroke-linejoin="round"/>
  <text x="120" y="640" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#10233f">Physical risk</text>
  <text x="120" y="710" font-family="Arial, sans-serif" font-size="52" fill="#607587">Floods and storms</text>

  <rect x="820" y="260" width="700" height="520" rx="28" fill="#ffffff" stroke="#2f8f5b" stroke-width="4"/>
  <rect x="870" y="330" width="130" height="260" fill="#2f8f5b"/>
  <rect x="1020" y="270" width="130" height="320" fill="#147d92"/>
  <rect x="1170" y="390" width="130" height="200" fill="#6d4fb0"/>
  <path d="M870 590 H1300" stroke="#10233f" stroke-width="6"/>
  <text x="870" y="680" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#10233f">Transition risk</text>
  <text x="870" y="750" font-family="Arial, sans-serif" font-size="52" fill="#607587">Policy and technology</text>

  <rect x="80" y="800" width="1440" height="80" rx="16" fill="#10233f"/>
  <text x="800" y="852" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" fill="#ffffff">Educational. Not investment advice.</text>
</svg>
