<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cybersecurity basics for students and small businesses</title>
  <desc id="desc">A padlock protecting accounts, a phishing email being flagged, and a backup drive, with a multi-factor authentication step.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#10233f">Cyber basics</text>
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="52" fill="#607587">Three habits for everyday digital risk</text>

  <g>
    <rect x="100" y="260" width="420" height="480" rx="28" fill="#ffffff" stroke="#147d92" stroke-width="4"/>
    <rect x="200" y="380" width="220" height="170" rx="18" fill="#147d92"/>
    <path d="M240 380 V330 a70 70 0 0 1 140 0 V380" fill="none" stroke="#147d92" stroke-width="22"/>
    <circle cx="310" cy="450" r="22" fill="#ffffff"/>
    <rect x="300" y="458" width="20" height="50" fill="#ffffff"/>
    <text x="310" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#10233f">Logins</text>

    <rect x="590" y="260" width="420" height="480" rx="28" fill="#ffffff" stroke="#2f6fb3" stroke-width="4"/>
    <rect x="650" y="330" width="300" height="200" rx="14" fill="#e6eef8" stroke="#2f6fb3" stroke-width="4"/>
    <path d="M650 340 L800 450 L950 340" fill="none" stroke="#2f6fb3" stroke-width="6"/>
    <circle cx="880" cy="390" r="36" fill="#f2b33d"/>
    <text x="880" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#10233f">!</text>
    <text x="800" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#10233f">Phishing</text>

    <rect x="1080" y="260" width="420" height="480" rx="28" fill="#ffffff" stroke="#2f8f5b" stroke-width="4"/>
    <rect x="1170" y="350" width="240" height="90" rx="12" fill="#2f8f5b"/>
    <rect x="1170" y="460" width="240" height="90" rx="12" fill="#6fb88f"/>
    <text x="1290" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#10233f">Backups</text>
  </g>

  <rect x="100" y="780" width="1400" height="90" rx="16" fill="#10233f"/>
  <text x="800" y="838" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" fill="#ffffff">Educational. Not professional IT advice.</text>
</svg>
