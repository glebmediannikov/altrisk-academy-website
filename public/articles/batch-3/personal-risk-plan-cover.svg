<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Personal risk management plan overview</title>
  <desc id="desc">Four steps of a personal risk plan: list risks, rate them, protect with savings and insurance, and review each year.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#10233f">Personal risk plan</text>
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="52" fill="#607587">Four steps, reviewed once a year</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="260" width="320" height="380" rx="24" fill="#ffffff" stroke="#147d92" stroke-width="4"/>
    <circle cx="240" cy="360" r="60" fill="#147d92"/>
    <text x="240" y="380" font-size="64" font-weight="700" fill="#ffffff">1</text>
    <text x="240" y="520" font-size="64" font-weight="700" fill="#10233f">List</text>

    <rect x="440" y="260" width="320" height="380" rx="24" fill="#ffffff" stroke="#2f6fb3" stroke-width="4"/>
    <circle cx="600" cy="360" r="60" fill="#2f6fb3"/>
    <text x="600" y="380" font-size="64" font-weight="700" fill="#ffffff">2</text>
    <text x="600" y="520" font-size="64" font-weight="700" fill="#10233f">Rate</text>

    <rect x="800" y="260" width="320" height="380" rx="24" fill="#ffffff" stroke="#6d4fb0" stroke-width="4"/>
    <circle cx="960" cy="360" r="60" fill="#6d4fb0"/>
    <text x="960" y="380" font-size="64" font-weight="700" fill="#ffffff">3</text>
    <text x="960" y="520" font-size="64" font-weight="700" fill="#10233f">Protect</text>

    <rect x="1160" y="260" width="360" height="380" rx="24" fill="#ffffff" stroke="#2f8f5b" stroke-width="4"/>
    <circle cx="1340" cy="360" r="60" fill="#2f8f5b"/>
    <text x="1340" y="380" font-size="64" font-weight="700" fill="#ffffff">4</text>
    <text x="1340" y="520" font-size="64" font-weight="700" fill="#10233f">Review</text>
  </g>
  <rect x="80" y="700" width="1440" height="110" rx="20" fill="#10233f"/>
  <text x="120" y="770" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Guideline: 6 months of living expenses</text>
</svg>
