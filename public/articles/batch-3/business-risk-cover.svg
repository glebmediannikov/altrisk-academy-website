<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Business risk management for young entrepreneurs</title>
  <desc id="desc">A small shop with a risk checklist, a reserve of cash covering one month of fixed costs, and an insurance shield.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#10233f">Business risk</text>
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="52" fill="#607587">Identify, reserve, insure, comply</text>

  <rect x="100" y="260" width="520" height="520" rx="28" fill="#ffffff" stroke="#2f6fb3" stroke-width="4"/>
  <path d="M160 430 L360 330 L560 430 V560 H160 Z" fill="#2f6fb3"/>
  <path d="M160 430 L360 330 L560 430" fill="none" stroke="#10233f" stroke-width="6"/>
  <rect x="300" y="480" width="120" height="80" fill="#f2b33d"/>
  <rect x="200" y="470" width="70" height="90" fill="#e6eef8"/>
  <rect x="450" y="470" width="70" height="90" fill="#e6eef8"/>
  <text x="360" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#10233f">Insurance</text>

  <rect x="660" y="260" width="840" height="240" rx="28" fill="#ffffff" stroke="#147d92" stroke-width="4"/>
  <text x="710" y="335" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#10233f">Checklist</text>
  <rect x="710" y="372" width="40" height="40" rx="6" fill="#147d92"/>
  <text x="770" y="404" font-family="Arial, sans-serif" font-size="56" fill="#10233f">Customers</text>
  <rect x="710" y="442" width="40" height="40" rx="6" fill="#147d92"/>
  <text x="770" y="474" font-family="Arial, sans-serif" font-size="56" fill="#10233f">Suppliers</text>
  <rect x="1080" y="372" width="40" height="40" rx="6" fill="#147d92"/>
  <text x="1140" y="404" font-family="Arial, sans-serif" font-size="56" fill="#10233f">Cash flow</text>
  <rect x="1080" y="442" width="40" height="40" rx="6" fill="#147d92"/>
  <text x="1140" y="474" font-family="Arial, sans-serif" font-size="56" fill="#10233f">Rules</text>

  <rect x="660" y="540" width="840" height="240" rx="28" fill="#ffffff" stroke="#2f8f5b" stroke-width="4"/>
  <text x="710" y="615" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#10233f">Cash reserve</text>
  <rect x="710" y="643" width="740" height="50" rx="25" fill="#e6eef8"/>
  <rect x="710" y="643" width="370" height="50" rx="25" fill="#2f8f5b"/>
  <text x="710" y="742" font-family="Arial, sans-serif" font-size="52" fill="#10233f">One month of fixed costs</text>
</svg>
