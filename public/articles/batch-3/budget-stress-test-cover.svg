<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stress testing a personal budget</title>
  <desc id="desc">A hypothetical budget tested against a car repair and a two-month income drop, showing a gap against the emergency fund.</desc>
  <rect width="1600" height="900" fill="#f6fafb"/>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="88" font-weight="700" fill="#10233f">Budget stress test</text>
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="52" fill="#607587">Hypothetical example, illustrative figures</text>

  <rect x="80" y="260" width="700" height="520" rx="28" fill="#ffffff" stroke="#147d92" stroke-width="4"/>
  <text x="130" y="330" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#10233f">Monthly budget</text>
  <rect x="130" y="370" width="600" height="70" rx="12" fill="#147d92"/>
  <text x="150" y="418" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Essentials $2,000</text>
  <rect x="130" y="460" width="420" height="70" rx="12" fill="#2f6fb3"/>
  <text x="150" y="508" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Savings $300</text>
  <text x="130" y="620" font-family="Arial, sans-serif" font-size="52" fill="#10233f">Take-home $2,300</text>
  <text x="130" y="690" font-family="Arial, sans-serif" font-size="52" fill="#10233f">Emergency fund $2,400</text>

  <rect x="820" y="260" width="700" height="520" rx="28" fill="#ffffff" stroke="#6d4fb0" stroke-width="4"/>
  <text x="870" y="330" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#10233f">Stress scenarios</text>
  <text x="870" y="400" font-family="Arial, sans-serif" font-size="52" fill="#10233f">Car repair $1,200</text>
  <text x="870" y="460" font-family="Arial, sans-serif" font-size="52" fill="#10233f">Income drop: 2 months</text>
  <text x="870" y="515" font-family="Arial, sans-serif" font-size="52" fill="#10233f">at $1,300 a month</text>
  <text x="870" y="590" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#6d4fb0">Gap: $2,600</text>
  <text x="870" y="655" font-family="Arial, sans-serif" font-size="52" fill="#10233f">Fund covers $2,400</text>
  <rect x="870" y="680" width="600" height="72" rx="12" fill="#f2b33d"/>
  <text x="890" y="730" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#10233f">Shortfall: $200</text>

  <rect x="80" y="800" width="1440" height="80" rx="16" fill="#10233f"/>
  <text x="800" y="852" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" fill="#ffffff">Illustrative only. Not financial advice.</text>
</svg>
